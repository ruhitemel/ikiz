name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Geri yükle
        run: dotnet restore windows/Ikiz.slnx

      - name: Derle
        run: dotnet build windows/Ikiz.slnx -c Release --no-restore

      - name: Testler
        run: dotnet run --project windows/tests/Ikiz.Tests/Ikiz.Tests.csproj -c Release --no-build
