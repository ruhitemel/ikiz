name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak sürüm (örn. 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sürüm numarasını normalize et
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sürüm notlarını ve kurulum metinlerini hazırla
        shell: pwsh
        run: |
          $raw = Get-Content -Raw -Encoding utf8 CHANGELOG.md
          $pattern = '(?ms)^## \[' + [regex]::Escape($env:VERSION) + '\].*?(?=^## \[|\z)'
          $match = [regex]::Match($raw, $pattern)
          if (-not $match.Success) { throw "$env:VERSION için sürüm notu bulunamadı." }
          $notes = $match.Value -replace '(?m)^\[.*\]:\s*\S+\s*$', ''
          [IO.File]::WriteAllText((Join-Path $pwd 'RELEASE_NOTES.md'), $notes.Trim(), (New-Object Text.UTF8Encoding($false)))
          Copy-Item LICENSE (Join-Path $pwd 'lisans.txt')
          Get-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Derle ve test et
        shell: pwsh
        run: |
          dotnet build windows/Ikiz.slnx -c Release
          dotnet run --project windows/tests/Ikiz.Tests/Ikiz.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Velopack CLI kur
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Uygulamayı yayınla (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish windows/src/Ikiz.App/Ikiz.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish -Recurse -Filter *.pdb -File | Remove-Item -Force
          $personal = Get-ChildItem publish -Recurse -File | Where-Object {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName))
            $text -match 'userntw|Default Project|C:\\Users\\'
          }
          if ($personal) {
            $personal | ForEach-Object { Write-Error ("Yerel yol içeren dosya: " + $_.Name) }
            exit 1
          }

      - name: Velopack paketini oluştur
        shell: pwsh
        run: |
          vpk pack `
            --packId ikiz `
            --packVersion $env:VERSION `
            --packAuthors "Ruhi Temel" `
            --packTitle "İkiz" `
            --packDir publish `
            --mainExe Ikiz.App.exe `
            --icon windows/src/Ikiz.App/Assets/ikiz.ico `
            --releaseNotes RELEASE_NOTES.md `
            --msi --instLocation Either `
            --instWelcome windows/installer/kurulum-mesaji.md `
            --instReadme windows/installer/kullanim-rehberi.md `
            --instLicense lisans.txt `
            --instConclusion windows/installer/kurulum-tamam.md `
            --outputDir Releases `
            --channel win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GitHub Releases'e yükle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          vpk upload github `
            --outputDir Releases `
            --channel win `
            --repoUrl https://github.com/ruhitemel/ikiz `
            --token $env:GITHUB_TOKEN `
            --tag $tag `
            --releaseName "İkiz $tag" `
            --publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Paketleri yapıt olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ikiz-${{ env.VERSION }}
          path: Releases/*
          if-no-files-found: error
